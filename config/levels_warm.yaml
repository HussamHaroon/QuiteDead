  n_zombies: 3
  advance_at: 0.70
  bats: [[5, 4], [33, 34]]
  safehouse: [2, 2, 8, 5]        # top-left building, interior x3-8 / y3-5
  win_stock: 8
  roads_x: [7, 32]
  roads_y: [7, 32]
  plazas: [[10, 10, 20, 20]]
  buildings:
    - [2, 2, 8, 5, "S"]
    - [30, 2, 8, 5, "S"]
    - [2, 33, 8, 5, "N"]
    - [30, 33, 8, 5, "N"]
