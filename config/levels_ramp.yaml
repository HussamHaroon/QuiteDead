  size: 32
  n_zombies: 1
  advance_at: 0.60
  bats: [[25, 14], [7, 5]]
  win_stock: 8
  reanimation_enabled: false
  roads_x: [8, 24]
  roads_y: [16]
  buildings:
    - [3, 3, 8, 6, "S"]
  safehouse: [21, 12, 8, 7]
  food: [[23, 14], [25, 16], [27, 14], [24, 17], [6, 5], [8, 6], [9, 4]]
